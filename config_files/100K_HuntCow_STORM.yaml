Task: "JointTrainAgent"
Environment:
  task: "HuntCow"
  task_parameter:
    image_size: [224,224]
    step_penalty: 0
    nav_reward_scale: 0.1
    attack_reward: 1
    success_reward: 10
    # max_spawn_range: 10
    # target_quantities: 1
    # max_episode_len: 500
  seed: 123
 
  action_space: "ReducedActionSpace"
  observation: "DefaultObservation" #ImageObservation

BasicSettings:
  Seed: 0
  ImageSize: 224
  ReplayBufferOnGPU: False

JointTrainAgent:
  SampleMaxSteps: 101024 #102000
  BufferMaxLength: 100000 #100000
  BufferWarmUp: 1024 #1024
  NumEnvs: 1
  BatchSize: 16
  DemonstrationBatchSize: 4
  BatchLength: 64
  ImagineBatchSize: 64
  ImagineDemonstrationBatchSize: 256
  ImagineContextLength: 8
  ImagineBatchLength: 16
  TrainDynamicsEverySteps: 1
  TrainAgentEverySteps: 1
  UseDemonstration: False
  SaveEverySteps: 2500

Models:
  use_amp: true
  WorldModel:
    #World model select
    ModleName: STORM # STORM / JEPA_WM
   
    #Image input channels
    InChannels: 3

    #VAE
    VAEParams:
      Symlog: False
      Type: categorical # categorical/continuous
      StochasticDim: 32
      EncodeFinalFeatureWidth: 7
      EncodeStemChannels: 32
      EncodeStemRepeatNum: 0
      # Decoding parameters will be repeated with encoding

    # dynamic model transformer
    TransformerParams:
      MaxLength: 64
      HiddenDim: 512
      NumLayers: 2
      NumHeads: 8

  Agent:
    InputFeature:
      - 1024  # VAE Categorical 32*32
      - 512   # Dynamic model hidden dim
    NumLayers: 3
    HiddenDim: 1024
    Gamma: 0.985
    Lambda: 0.95
    EntropyCoef: 3E-4

